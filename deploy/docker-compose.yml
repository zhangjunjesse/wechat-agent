services:
  wechat-agent:
    build: ..
    container_name: wechat-agent
    restart: unless-stopped
    env_file: ./server.env
    ports:
      - "127.0.0.1:8789:8789"
    volumes:
      - ./data:/data
      - ../assistant-qr.jpg:/app/assistant-qr.jpg:ro
      # Read-only access to the wechat-sync receiver's SQLite DB (same host,
      # sibling container) for the wechat-search skill — see ADR-0007.
      - /opt/wechat-sync/data:/wechat-sync-data:ro
